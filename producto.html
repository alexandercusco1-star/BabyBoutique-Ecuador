<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto | Baby Boutique Ecuador</title>

    <!-- Estilos Unificados -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Tipografía Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

    <div class="main-wrapper">
        <!-- Banner de Envío Gratis Dinámico -->
        <div class="shipping-banner">
            <div id="shipping-text">🚚 ¡Agrega <strong>12 prendas</strong> para obtener <strong>ENVÍO GRATIS</strong> en Ecuador!</div>
            <div class="shipping-progress-bar">
                <div class="shipping-progress-fill" id="shipping-fill"></div>
            </div>
        </div>

        <!-- Encabezado / Navegación -->
        <header>
            <div class="header-container">
                <a href="index.html" class="logo">
                    👶 <span>Baby Boutique</span>
                </a>

                <nav>
                    <ul>
                        <li><a href="index.html">Inicio</a></li>
                        <li><a href="productos.html" class="active">Productos</a></li>
                        <li><a href="nosotros.html">Nosotros</a></li>
                        <li><a href="contacto.html">Contacto</a></li>
                    </ul>
                </nav>

                <div class="acciones">
                    <a href="carrito.html" class="cart-icon-btn" title="Ver Carrito">
                        🛒 Carrito
                        <span class="cart-badge" id="contadorCarrito">0</span>
                    </a>
                </div>
            </div>
        </header>

        <!-- Contenido Principal - Detalle de Producto -->
        <main class="container">
            <section style="margin: 30px 0;">
                <a href="productos.html" class="btn-secondary" style="display: inline-block; margin-bottom: 20px; text-decoration: none;">⬅️ Volver al Catálogo</a>
                
                <div class="products-grid" id="detalle-producto" style="grid-template-columns: 1fr; max-width: 800px; margin: 0 auto;">
                    <!-- El producto individual se renderiza dinámicamente mediante app.js -->
                </div>
            </section>
        </main>

        <!-- Pie de página -->
        <footer>
            <div class="container">
                <p>© 2026 Baby Boutique Ecuador. Todos los derechos reservados.</p>
            </div>
        </footer>
    </div>

    <!-- Scripts del Sistema -->
    <script src="js/carrito.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
