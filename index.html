<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baby Boutique - Catálogo</title>
    <style>
        * { box-sizing: border-box; font-family: sans-serif; }
        body { margin: 0; padding: 20px; background-color: #f9fafb; }
        #grid-productos {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
    </style>
</head>
<body>

    <h1 style="text-align: center; color: #1f2937;">Catálogo de Productos</h1>

    <!-- Contenedor donde se cargan los productos -->
    <div id="grid-productos"></div>

    <!-- Carga del script desde la carpeta js -->
    <script src="js/productos.js"></script>
</body>
</html>
